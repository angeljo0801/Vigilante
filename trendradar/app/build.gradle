plugins { id 'com.android.application' }
android {
 namespace 'com.trendradar.app'
 compileSdk 35
 defaultConfig { applicationId 'com.trendradar.app'; minSdk 26; targetSdk 34; versionCode 2; versionName '1.1.0' }
 signingConfigs { release {
 def path = System.getenv('TREND_KEYSTORE_PATH')
 if (path) { storeFile file(path); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') }
 } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.work:work-runtime:2.9.1'; implementation 'org.jsoup:jsoup:1.18.3' }
