name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Vigilante APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -d "$SDK_ROOT/build-tools/34.0.0" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;34.0.0" "platform-tools"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          ls "$SDK_ROOT/build-tools"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pruebas unitarias
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vigilante-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
